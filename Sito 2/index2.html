<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRA SE HAI IL CORAGGIO</title>
    <style>
        /* Stili Generali e Atmosfera Horror */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #e30b0b;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(227, 11, 11, 0.6);
        }

        /* Contenitore Principale */
        .container {
            text-align: center;
            width: 90%;
            max-width: 640px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Titolo della pagina */
        h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            animation: pulse 2s infinite alternate;
        }

        /* Schermata Video */
        #video-screen {
            width: 100%;
        }

        video {
            width: 100%;
            max-width: 640px;
            border: 2px solid #e30b0b;
            box-shadow: 0 0 25px rgba(227, 11, 11, 0.4);
            background-color: #000;
        }

        /* Animazioni */
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 8px rgba(227, 11, 11, 0.6); }
            100% { transform: scale(1.02); text-shadow: 0 0 20px rgba(227, 11, 11, 0.9); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BENVENUTO</h1>

        <div id="video-screen">
            <video id="my-video" controls playsinline autoplay>
                <!-- Sostituisci il percorso sotto con il nuovo video -->
                <source src="Enigma/Enigma.mp4" type="video/mp4">
                Il tuo browser non supporta questo video.
            </video>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.getElementById('my-video');
            
            // Tentativo di autoplay con audio
            videoElement.play().catch(error => {
                console.log("Autoplay con audio bloccato dal browser, avvio mutato:", error);
                // Fallback: se il browser blocca l'audio automatico, muta per far partire il video
                videoElement.muted = true;
                videoElement.play();
            });
        });
    </script>
</body>
</html>
